[package]
name = "igvm-diff"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Structural comparisons of IGVM files"
repository = "https://github.com/bschaatsbergen/igvm-diff"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
igvm = { version = "=0.5.0", default-features = false }
igvm_defs = "=0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
zerocopy = "0.8.63"

[dev-dependencies]
crc32fast = "1.5.2"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
